<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Phishing Guardian</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 16px;
      width: 280px;
      background: #4f627e;
    }

    .card {
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      padding: 20px;
      text-align: center;
    }

    h3 {
      margin: 0 0 12px;
      font-size: 18px;
      color: #333;
    }

    #result {
      font-size: 16px;
      margin-top: 12px;
    }

    .safe {
      color: #28a745; /* green */
    }

    .suspicious {
      color: #dc3545; /* red */
    }

    .icon {
      font-size: 24px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="icon" class="icon">🔍</div>
    <h3>Phishing Guard</h3>
    <div id="result">Scanning...</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
